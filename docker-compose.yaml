version: '3.8'

services:
  spark:
    build: .
    image: etl_spark:latest
    container_name: ETL_Spark
    volumes:
      - .:/opt/spark/work
    # Keep the container alive so Airflow can trigger scripts inside it
    tty: true 
    stdin_open: true

  airflow:
    image: apache/airflow:2.10.2-python3.10
    container_name: Airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/spark/work
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: standalone