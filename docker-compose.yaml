services:
  spark:
    container_name: dynamic_pipeline
    image: apache/spark:3.5.0 # (Or whatever spark image you are using)
    # ... your existing spark configuration lines ...

  airflow:
    image: apache/airflow:2.10.2-python3.10
    container_name: airflow_scheduler
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/spark/work
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: standalone